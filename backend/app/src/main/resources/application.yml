spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:file:../data/hotel_selection;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
  ai:
    openai:
      base-url: ${hotel.llm.base-url}
      api-key: ${hotel.llm.api-key}
      chat:
        options:
          model: ${hotel.llm.model}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${PORT:8080}
hotel:
  llm:
    base-url: ${HOTEL_LLM_BASE_URL:https://api.openai.com}
    api-key: ${HOTEL_LLM_API_KEY:}
    model: ${HOTEL_LLM_MODEL:}
  maps:
    amap:
      api-key: ${amap_key:}
      endpoint: ${AMAP_MCP_ENDPOINT:https://mcp.amap.com/mcp}
